<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Corps du robot -->
  <rect x="25" y="35" width="50" height="45" rx="8" fill="#22c55e" stroke="#16a34a" stroke-width="2"/>
  
  <!-- Tête/capteur supérieur -->
  <circle cx="50" cy="25" r="8" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Yeux -->
  <circle cx="40" cy="50" r="5" fill="#1e293b" opacity="0.8"/>
  <circle cx="60" cy="50" r="5" fill="#1e293b" opacity="0.8"/>
  
  <!-- Roues -->
  <circle cx="33" cy="82" r="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="67" cy="82" r="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- Détails roues -->
  <circle cx="33" cy="82" r="3" fill="#475569"/>
  <circle cx="67" cy="82" r="3" fill="#475569"/>
  
  <!-- Ligne centrale décorative -->
  <line x1="50" y1="60" x2="50" y2="72" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Points lumineux (LEDs) -->
  <circle cx="42" cy="66" r="2" fill="#3b82f6" opacity="0.8"/>
  <circle cx="58" cy="66" r="2" fill="#ef4444" opacity="0.8"/>
</svg>
